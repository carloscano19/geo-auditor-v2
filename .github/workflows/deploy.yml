name: Deploy GEO-Auditor Legacy Redirect

on:
  push:
    branches: [main]

jobs:
  deploy-redirect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate redirect index.html
        run: |
          mkdir -p redirect-dist
          cat << 'EOF' > redirect-dist/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=${{ vars.NEW_FRONTEND_URL }}">
            <title>GEO-AUDITOR</title>
          </head>
          <body>
            <p>GEO-AUDITOR has moved to <a href="${{ vars.NEW_FRONTEND_URL }}">${{ vars.NEW_FRONTEND_URL }}</a>.</p>
          </body>
          </html>
          EOF

      - name: Upload redirect via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: carloscanofernandez.com
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: 21
          local-dir: ./redirect-dist/
          server-dir: /domains/carloscanofernandez.com/public_html/geo-auditor/
          protocol: ftp
